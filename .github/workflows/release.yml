# Orchestrate the full release while keeping each language release workflow
# independently runnable through workflow_dispatch.

name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-rc[0-9]+"
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

jobs:
  release-preflight:
    name: Validate release versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify tag and component versions
        if: startsWith(github.ref, 'refs/tags/')
        run: python3 tools/verify_release_versions.py "${{ github.ref_name }}"

  rust:
    name: Rust release
    needs: [release-preflight]
    uses: ./.github/workflows/release-rust.yml
    secrets: inherit

  java:
    name: Java release
    needs: [release-preflight]
    uses: ./.github/workflows/release-java.yml
    secrets: inherit

  python-wheels:
    name: Python wheels
    needs: [release-preflight]
    uses: ./.github/workflows/release-python.yml
    secrets: inherit

  python-publish:
    name: Python publish
    needs: [rust, java, python-wheels]
    if: startsWith(github.ref, 'refs/tags/')
    uses: ./.github/workflows/release-python-publish.yml
    secrets: inherit
