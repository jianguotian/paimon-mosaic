# Orchestrate the full release while keeping each language release workflow
# independently runnable through workflow_dispatch.

name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-rc[0-9]+"
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

jobs:
  release-preflight:
    name: Validate release tag, versions, and source archive
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Import release verification keys
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          keys_file="${RUNNER_TEMP}/KEYS"
          curl --fail --location --proto '=https' --tlsv1.2 \
            --output "${keys_file}" \
            https://downloads.apache.org/paimon/KEYS
          gpg --batch --import "${keys_file}"

      - name: Verify tag and component versions
        if: startsWith(github.ref, 'refs/tags/')
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: python3 tools/verify_release_versions.py "${TAG_NAME}" --verify-signature

      - name: Verify source archive
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          release_version="${GITHUB_REF_NAME#v}"
          release_version="${release_version%-rc*}"
          archive="${RUNNER_TEMP}/apache-paimon-mosaic-${release_version}-src.tgz"
          prefix="paimon-mosaic-${release_version}/"
          commit="$(git rev-parse --verify 'HEAD^{commit}')"
          python3 tools/verify_source_archive.py create \
            --repository "${GITHUB_WORKSPACE}" \
            --commit "${commit}" \
            --prefix "${prefix}" \
            --output "${archive}"
          python3 tools/verify_source_archive.py verify \
            --repository "${GITHUB_WORKSPACE}" \
            --commit "${commit}" \
            --prefix "${prefix}" \
            --archive "${archive}"

  rust:
    name: Rust release
    needs: [release-preflight]
    uses: ./.github/workflows/release-rust.yml
    secrets: inherit

  java:
    name: Java release
    needs: [release-preflight]
    uses: ./.github/workflows/release-java.yml
    secrets: inherit

  python-wheels:
    name: Python wheels
    needs: [release-preflight]
    uses: ./.github/workflows/release-python.yml
    secrets: inherit

  python-publish:
    name: Python publish
    needs: [rust, java, python-wheels]
    if: startsWith(github.ref, 'refs/tags/')
    uses: ./.github/workflows/release-python-publish.yml
    secrets: inherit
