name: Release Preflight

on:
  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    name: Validate release tag and versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate signed release tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set -euo pipefail

          curl \
            --proto '=https' \
            --tlsv1.2 \
            --fail \
            --location \
            --retry 3 \
            --retry-connrefused \
            --connect-timeout 10 \
            --max-time 300 \
            https://downloads.apache.org/paimon/KEYS \
            --output "$RUNNER_TEMP/paimon-KEYS"

          python3 tools/validate_release_tag.py \
            "$GITHUB_REF_NAME" \
            --keys-file "$RUNNER_TEMP/paimon-KEYS" \
            --repository . \
            --expected-commit "$GITHUB_SHA"

      - name: Verify release component versions
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set -euo pipefail

          version="${GITHUB_REF_NAME#v}"
          version="${version%%-rc*}"
          python3 tools/verify_release_versions.py "$version"
