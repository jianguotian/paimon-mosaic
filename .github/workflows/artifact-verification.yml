name: Artifact Verification

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: artifact-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: "8"
          distribution: temurin

      - name: Install verifier test dependencies
        run: python -m pip install pytest pyyaml build

      - name: Run artifact verifier tests
        run: |
          pytest -q \
            tools/tests/test_artifact_release_workflow.py \
            tools/tests/test_python_setup.py \
            tools/tests/test_verify_java_jars.py \
            tools/tests/test_verify_python_wheels.py

      - name: Compile and statically check verifier sources
        run: |
          python -m compileall -q \
            python/setup.py \
            tools/archive_guard.py \
            tools/verify_java_jars.py \
            tools/verify_python_wheels.py \
            tools/tests/test_artifact_release_workflow.py \
            tools/tests/test_python_setup.py \
            tools/tests/test_verify_java_jars.py \
            tools/tests/test_verify_python_wheels.py
          git diff --check

      - name: Build and verify an assembled Linux wheel
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/release dist
          printf '\177ELFartifact-verification-fixture\n' \
            > target/release/libpaimon_mosaic_ffi.so
          _PYTHON_HOST_PLATFORM=manylinux_2_28_x86_64 \
            python -m build --wheel --outdir dist python
          python tools/verify_python_wheels.py dist/*.whl

      - name: Assemble and verify Maven release JARs
        shell: bash
        run: |
          set -euo pipefail
          mvn -f java/pom.xml -DskipTests compile
          python - <<'PY'
          from pathlib import Path

          classes = Path("java/target/classes")
          fixtures = {
              "native/linux/x86_64/libpaimon_mosaic_jni.so": b"\x7fELFx86",
              "native/linux/aarch64/libpaimon_mosaic_jni.so": b"\x7fELFarm",
              "native/macos/aarch64/libpaimon_mosaic_jni.dylib": b"\xcf\xfa\xed\xfemac",
          }
          pe = bytearray(132)
          pe[:2] = b"MZ"
          pe[0x3C:0x40] = (0x80).to_bytes(4, "little")
          pe[0x80:0x84] = b"PE\0\0"
          fixtures["native/windows/x86_64/paimon_mosaic_jni.dll"] = bytes(pe)
          for name, contents in fixtures.items():
              path = classes / name
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(contents)
          PY
          # The release profile invokes tools/verify_java_jars.py on the three
          # JARs assembled by this Maven lifecycle.
          mvn -f java/pom.xml \
            -DskipTests \
            -Dgpg.skip=true \
            -Prelease \
            verify
